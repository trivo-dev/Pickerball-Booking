<div class="change-password-container">
    <div class="change-password-card">
        <h2>Đổi mật khẩu</h2>

        <form (ngSubmit)="onChangePassword()" novalidate>

            <div class="form-group">
                <label>Mật khẩu cũ</label>
                <input type="password" name="oldPassword" [(ngModel)]="data.oldPassword"
                    placeholder="Nhập mật khẩu cũ" />
            </div>

            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="newPassword" [(ngModel)]="data.newPassword"
                    placeholder="Nhập mật khẩu mới" />
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" [(ngModel)]="data.confirmPassword"
                    placeholder="Nhập lại mật khẩu mới" />
            </div>

            <p class="error" *ngIf="errorMessage()">
                {{ errorMessage() }}
            </p>

            <p class="success" *ngIf="successMessage()">
                {{ successMessage() }}
            </p>

          
            <button type="submit">
                Đổi mật khẩu
            </button>

            <a routerLink="/" class="back-link">
                Quay về trang chủ
            </a>

        </form>
    </div>
</div>
