<div class="auth-container">
  <div class="auth-card">

<form *ngIf="step() === 1" (ngSubmit)="sendPin()" novalidate>
  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      name="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      placeholder="Nhập email"
    />
  </div>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  <p class="success" *ngIf="successMessage()">{{ successMessage() }}</p>

  <button type="submit" [disabled]="isLoading()">
    {{ isLoading() ? 'Đang gửi...' : 'Gửi mã PIN' }}
  </button>
</form>

<form *ngIf="step() === 2" (ngSubmit)="verifyPin()" novalidate>
  <div class="form-group">
    <label>Mã PIN</label>
    <input
      type="text"
      name="pin"
      [ngModel]="pin()"
      (ngModelChange)="pin.set($event)"
      placeholder="Nhập mã PIN"
    />
  </div>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  <p class="success" *ngIf="successMessage()">{{ successMessage() }}</p>

  <button type="submit" [disabled]="isLoading()">
    {{ isLoading() ? 'Đang kiểm tra...' : 'Xác nhận mã PIN' }}
  </button>
</form>


<form *ngIf="step() === 3" (ngSubmit)="resetPassword()" novalidate>
  <div class="form-group">
    <label>Mật khẩu mới</label>
    <input
      type="password"
      name="newPassword"
      [ngModel]="newPassword()"
      (ngModelChange)="newPassword.set($event)"
      placeholder="Nhập mật khẩu mới"
    />
  </div>

  <div class="form-group">
    <label>Xác nhận mật khẩu</label>
    <input
      type="password"
      name="confirmPassword"
      [ngModel]="confirmPassword()"
      (ngModelChange)="confirmPassword.set($event)"
      placeholder="Nhập lại mật khẩu mới"
    />
  </div>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  <p class="success" *ngIf="successMessage()">{{ successMessage() }}</p>

  <button type="submit" [disabled]="isLoading()">
    {{ isLoading() ? 'Đang đổi...' : 'Đổi mật khẩu' }}
  </button>
</form>
  </div>
</div>
