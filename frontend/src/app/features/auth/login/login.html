<div class="auth-container">
  <div class="auth-card">
    <h2>Đăng nhập</h2>

    <form (ngSubmit)="onLogin()" novalidate>

      <div class="form-group">
        <label>Email</label>
        <input type="text" name="email" [(ngModel)]="loginData.email" placeholder="Nhập email" />
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="Nhập mật khẩu" />
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit">Đăng nhập</button>

      <p class="switch-page">
        Chưa có tài khoản?
        <a routerLink="/register">Đăng ký</a>
      </p>

      <p class="switch-page">
        Quên mật khẩu?
        <a routerLink="/forgot-password">Lấy lại mật khẩu</a>
      </p>

    </form>
  </div>
</div>
