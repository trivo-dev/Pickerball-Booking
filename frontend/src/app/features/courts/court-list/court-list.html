<div class="court-list">

  <div class="court-card" *ngFor="let court of courts()">

    <img [src]="court.imageUrl" [alt]="court.name">

    <div class="content">
      <h2>{{ court.name }}</h2>

      <p>{{ court.location }}</p>

      <p class="price">
        {{ court.pricePerHour | currency:'VND':'symbol':'1.0-0' }}/ giờ
      </p>

      <a [routerLink]="['/courts', court.id]">
        Xem chi tiết
      </a>
    </div>

  </div>

</div>
